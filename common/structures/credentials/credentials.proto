syntax = "proto3";

package credentials;

option go_package = "/credentials";

/*
 * Credentials used by the CNC to authenticate to a managed device.
 *
 * The credential itself does not describe:
 *   - which node it belongs to
 *   - which management protocol is being used
 *   - which transport is being used
 *
 * Those belong to the management/topology configuration.
 *
 * Example combinations:
 *
 *   NETCONF + SSH + USERNAME_PASSWORD
 *   NETCONF + SSH + SSH_PRIVATE_KEY
 *   NETCONF + TLS + TLS_CLIENT_CERTIFICATE
 *   gNMI    + TLS + TLS_CLIENT_CERTIFICATE
 *   SNMP    + UDP + SNMP_V2C_COMMUNITY
 *   SNMP    + UDP + SNMP_V3
 */
message ManagementCredentials {

    oneof authentication {

        UsernamePassword username_password = 1;

        SshPrivateKey ssh_private_key = 2;

        TlsClientCertificate tls_client_certificate = 3;

        SnmpV2cCommunity snmp_v2c_community = 4;

        SnmpV3Credentials snmp_v3 = 5;
    }
}


/*
 * Generic username/password authentication.
 *
 * Can be used by management protocols that support
 * username/password authentication.
 */
message UsernamePassword {

    string username = 1;

    string password = 2;
}


/*
 * SSH public-key authentication.
 *
 * The private key is secret material and therefore belongs
 * in the credential store rather than the topology.
 */
message SshPrivateKey {

    string username = 1;

    string private_key = 2;

    /*
     * Optional passphrase protecting the private key.
     */
    optional string passphrase = 3;
}


/*
 * TLS client certificate authentication.
 *
 * The private key is secret material.
 *
 * CA certificate is included here because the credential
 * configuration may need to define the trust chain used
 * when establishing the TLS connection.
 */
message TlsClientCertificate {

    /*
     * CA certificate(s) used to validate the server.
     */
    string ca_certificate = 1;

    /*
     * Client certificate presented by the CNC.
     */
    string client_certificate = 2;

    /*
     * Private key corresponding to client_certificate.
     */
    string client_private_key = 3;

    /*
     * Optional passphrase protecting the private key.
     */
    optional string private_key_passphrase = 4;
}


/*
 * SNMPv2c community-based authentication.
 */
message SnmpV2cCommunity {

    string community = 1;
}


/*
 * SNMPv3 authentication.
 *
 * SNMPv3 separates authentication and privacy.
 */
message SnmpV3Credentials {

    string username = 1;

    optional string authentication_password = 2;

    optional string privacy_password = 3;
}