syntax = "proto3";

package stream;

option go_package = "/stream_config";

import "common/structures/stream/stream.proto";
import "common/structures/stream_identification/stream_identification.proto";
import "common/structures/frer/frer.proto";
import "common/structures/psfp/psfp.proto";

/*
 * StreamConfiguration
 *
 * CNC-level configuration of a logical TSN Stream and its optional
 * TSN processing functions.
 *
 * The logical Stream is defined by stream.proto.
 *
 * This configuration associates that Stream with the TSN mechanisms
 * that may be required to transport it:
 *
 *   IEEE 802.1AS   - time synchronization
 *   IEEE 802.1Q    - VLAN / priority
 *   IEEE 802.1Qcc  - Stream Reservation / traffic specification
 *   IEEE 802.1Qbv  - Time-Aware Scheduling
 *   IEEE 802.1Qci  - Per-Stream Filtering and Policing
 *   IEEE 802.1CB   - Stream Identification
 *   IEEE 802.1CB   - FRER
 *   IEEE 802.1Qca  - Explicit path control
 *
 * IMPORTANT:
 *
 * None of the optional TSN processing functions is implicitly enabled.
 * A StreamConfiguration may contain only the mechanisms required for
 * that particular Stream.
 */


/* ========================================================================= */
/* Supporting types                                                          */
/* ========================================================================= */

/*
 * IEEE 802.1Q queue / traffic-class assignment.
 *
 * This is a CNC-level association between a stream and an egress
 * traffic class / queue.
 */
message QueueAssignment {
  string egress_port_id = 1;

  /*
   * Traffic class / queue identifier.
   *
   * Valid range depends on the bridge implementation.
   */
  uint32 queue_id = 2;
}


/*
 * IEEE 802.1AS time synchronization reference.
 */
message TimeSyncReference {
  uint32 domain_number = 1;

  /*
   * IEEE 1588 clock identity.
   */
  string clock_identity = 2;
}


/*
 * CNC/runtime Stream Reservation status.
 *
 * This is operational state rather than IEEE 802.1Qcc configuration.
 */
enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  CONFIRMED = 2;
  FAILED = 3;
  RELEASED = 4;
}


message StreamReservationStatus {

  stream.StreamId stream_id = 1;

  ReservationStatus status = 2;

  string cnc_decision_reason = 3;

  uint64 last_updated_ns = 4;
}


/*
 * One hop in a CNC-computed explicit path.
 *
 * This is a topology/path representation used by the CNC.
 *
 * IEEE 802.1Qca / IEEE 802.1Qcc and related TSN management models
 * may use explicit path information, while the actual forwarding
 * mechanism is implementation-dependent.
 */
message StreamHop {

  uint32 hop_number = 1;

  string bridge_id = 2;

  string ingress_port_id = 3;

  string egress_port_id = 4;
}


/*
 * Stream-level bandwidth reservation information.
 *
 * This represents the bandwidth allocated by the CNC and is not
 * itself the complete IEEE 802.1Qcc traffic specification.
 */
message BandwidthReservation {

  uint64 reserved_bandwidth_bps = 1;

  uint64 max_burst_bytes = 2;

  uint64 shaping_interval_ns = 3;
}


/* ========================================================================= */
/* Main Stream configuration                                                 */
/* ========================================================================= */

/*
 * Complete CNC configuration for one logical Stream.
 *
 * The logical Stream is identified by stream_id.
 *
 * All processing domains below are optional.
 */
message StreamConfiguration {

  /*
   * Logical TSN Stream.
   *
   * Required.
   */
  stream.StreamId stream_id = 1;


  /* ----------------------------------------------------------------------- */
  /* Time synchronization                                                   */
  /* ----------------------------------------------------------------------- */

  /*
   * Optional IEEE 802.1AS time synchronization reference.
   *
   * Presence means that this Stream configuration depends on the
   * specified gPTP time domain.
   */
  optional TimeSyncReference time_sync_reference = 2;


  /* ----------------------------------------------------------------------- */
  /* VLAN / priority                                                        */
  /* ----------------------------------------------------------------------- */

  /*
   * Optional VLAN association.
   *
   * VLAN configuration itself is modeled by vlan.proto.
   *
   * This field represents the VLAN used by this Stream rather than
   * defining the VLAN globally.
   */
  optional uint32 vlan_id = 3;

  /*
   * Optional PCP / priority associated with this Stream.
   *
   * Valid range: 0..7.
   */
  optional uint32 pcp = 4;


  /* ----------------------------------------------------------------------- */
  /* Bandwidth / Latency                                                */
  /* ----------------------------------------------------------------------- */

  /*
   * Optional bandwidth reservation.
   *
   * Absence means that no CNC bandwidth reservation is associated
   * with this Stream through this configuration.
   */
  optional BandwidthReservation bandwidth_reservation = 5;

  /*
   * End-to-end accumulated latency for this Stream.
   *
   * Value is in nanoseconds.
   */
  optional uint64 accumulated_latency_ns = 6;


  /* ----------------------------------------------------------------------- */
  /* Time-aware scheduling                                                  */
  /* ----------------------------------------------------------------------- */

  /*
   * Optional Qbv scheduling offset.
   *
   * This field is only meaningful when the Stream is associated with
   * a time-aware schedule.
   *
   * The actual Gate Control List is modeled by the appropriate
   * scheduling configuration rather than here.
   */
  optional uint64 time_aware_offset_ns = 7;


  /* ----------------------------------------------------------------------- */
  /* Explicit path                                                         */
  /* ----------------------------------------------------------------------- */

  /*
   * Optional CNC-computed path.
   *
   * Empty means that this StreamConfiguration does not specify an
   * explicit path.
   */
  repeated StreamHop path = 8;


  /* ----------------------------------------------------------------------- */
  /* IEEE 802.1CB Stream Identification                                      */
  /* ----------------------------------------------------------------------- */

  /*
   * Optional Stream Identification association.
   *
   * The identification function associates received frames with the
   * local stream_handle used by TSN processing functions.
   *
   * Multiple identification entries may be required for a Stream,
   * for example when the Stream is identified differently on
   * different ports.
   */
  repeated tsn.stream_identification.StreamIdentificationEntry
      stream_identification = 9;


  /* ----------------------------------------------------------------------- */
  /* IEEE 802.1CB FRER                                                      */
  /* ----------------------------------------------------------------------- */

  /*
   * Optional FRER configuration.
   *
   * Absence means this Stream does not use FRER through this
   * StreamConfiguration.
   *
   * FRER configuration references the local stream_handle /
   * Stream Identification domain rather than duplicating frame
   * identification criteria here.
   */
  optional tsn.frer.FrerConfiguration frer = 10;


  /* ----------------------------------------------------------------------- */
  /* IEEE 802.1Qci PSFP                                                     */
  /* ----------------------------------------------------------------------- */

  /*
   * Optional PSFP configuration.
   *
   * PSFP operates on an identified Stream and therefore does not
   * need to duplicate Stream Identification criteria here.
   */
  optional tsn.psfp.StreamFilterInstance psfp_filter = 11;


  /* ----------------------------------------------------------------------- */
  /* Egress queue / traffic class                                            */
  /* ----------------------------------------------------------------------- */

  /*
   * Optional per-port queue assignments.
   */
  repeated QueueAssignment queue_assignments = 12;


  /* ----------------------------------------------------------------------- */
  /* Administrative information                                              */
  /* ----------------------------------------------------------------------- */

  /*
   * CNC administrative state.
   */
  bool enabled = 13;

  /*
   * Human-readable description.
   */
  string description = 14;
}
