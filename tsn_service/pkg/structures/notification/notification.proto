syntax = "proto3";

package notification;

option go_package = "OpenCNC/tsn_service/pkg/structures/notification;notification";

import "google/protobuf/timestamp.proto";

service Notification {

  // Single intake point for notifications from other OpenCNC services.
  rpc Notify(Event) returns (NotifyResponse) {}
}


// ============================================================================
// Event
// ============================================================================

message Event {

  string event_id = 1;

  EventType type = 2;

  google.protobuf.Timestamp occurred_at = 3;

  // Service that generated the event.
  //
  // Examples:
  //   "monitor-service"
  //   "main-service"
  string source = 4;

  oneof payload {
    StreamAdded stream_added = 10;
    StreamRemoved stream_removed = 11;
    NetworkEvent network_event = 12;
  }
}


// ============================================================================
// Event types
// ============================================================================

enum EventType {

  EVENT_TYPE_UNSPECIFIED = 0;

  // A new TSN stream/reservation was requested.
  STREAM_ADDED = 1;

  // An existing TSN stream/reservation was removed.
  STREAM_REMOVED = 2;

  // A network/topology event was detected.
  NETWORK_EVENT = 3;
}


// ============================================================================
// Stream events
// ============================================================================

message StreamAdded {

  // Identifier(s) associated with the stream request.
  repeated string request_ids = 1;

  // Optional stream identifier.
  string stream_id = 2;
}


message StreamRemoved {

  // Identifier(s) associated with the stream request.
  repeated string request_ids = 1;

  // Optional stream identifier.
  string stream_id = 2;

  string reason = 3;
}


// ============================================================================
// Network events
// ============================================================================

message NetworkEvent {

  NetworkTrigger trigger = 1;

  // Objects known to be affected by the event.
  repeated string affected_node_ids = 2;
  repeated string affected_link_ids = 3;

  string reason = 4;
}


enum NetworkTrigger {

  NETWORK_TRIGGER_UNSPECIFIED = 0;

  LINK_DOWN = 1;
  LINK_UP = 2;

  NODE_DOWN = 3;
  NODE_UP = 4;

  TOPOLOGY_CHANGED = 5;

  RESOURCE_THRESHOLD = 6;

  MANUAL_RECALCULATION = 7;
}


// ============================================================================
// Response
// ============================================================================

message NotifyResponse {

  // Notification was accepted by the TSN service.
  bool accepted = 1;

  // Optional identifier for the internal configuration/reconfiguration
  // workflow started by the event.
  string workflow_id = 2;

  string message = 3;
}
